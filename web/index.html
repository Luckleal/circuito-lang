<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>circuito-lang</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/circuit.css">
  <link rel="stylesheet" href="/css/analysis.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 12h4l4-6M12 12l4 6"/></svg><span>circuito-lang</span><small data-i18n="app.lab"></small></div>
    <div class="header-actions">
      <label class="example-label" for="examples" data-i18n="app.example"></label><select id="examples" data-i18n-aria="app.example_aria"><option data-i18n="app.loading"></option></select>
      <button id="import" type="button" data-i18n="app.import"></button><input id="file" type="file" accept=".circ,text/plain" hidden>
      <button id="download" type="button" data-i18n="app.download"></button>
      <label class="sr-only" for="language" data-i18n="app.language"></label><select id="language" data-i18n-aria="app.language"><option value="pt-BR">Português</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="zh-CN">简体中文</option><option value="ja">日本語</option></select>
      <button id="theme" class="icon-button" type="button" data-i18n-aria="app.theme" data-i18n-title="app.theme"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 2.5a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15Z"/><path d="M10 2.5v15"/></svg></button>
      <button id="analyze" class="primary" type="button"><span data-i18n="app.analyze"></span><span class="shortcut" aria-hidden="true">Ctrl/⌘ ↵</span></button>
    </div>
  </header>
  <nav class="mobile-tabs" data-i18n-aria="app.area"><button type="button" data-view="editor" class="active" data-i18n="app.editor"></button><button type="button" data-view="results" data-i18n="app.results"></button></nav>
  <main id="workspace" class="workspace" data-view="editor">
    <section id="editor-pane" class="editor-pane" data-i18n-aria="app.editor">
      <div class="pane-heading"><div><h1 data-i18n="app.editor"></h1><p data-i18n="app.editor_help"></p></div><span id="editor-state" class="pill" data-i18n="app.ready"></span></div>
      <div class="code-shell"><div id="lines" class="line-numbers" aria-hidden="true">1</div><div class="code-stack"><div id="current-line" aria-hidden="true"></div><pre id="highlight" aria-hidden="true"></pre><textarea id="code" data-i18n-aria="app.code_aria" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div></div>
      <div class="editor-footer"><span data-i18n="app.file"></span><span id="cursor"></span></div>
    </section>
    <div id="splitter" class="splitter" role="separator" tabindex="0" data-i18n-aria="app.resize" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="43"></div>
    <section id="results-pane" class="results-pane" data-i18n-aria="app.results">
      <div class="results-top"><div><h2 data-i18n="app.results"></h2><p id="analysis-summary" data-i18n="app.awaiting"></p></div><span id="stale" class="stale" data-i18n="app.stale" hidden></span></div>
      <div id="status" class="sr-only" role="status" aria-live="polite"></div>
      <div class="tabs-scroll"><div id="tabs" class="tabs" role="tablist" data-i18n-aria="app.tabs">
        <button role="tab" id="tab-diagnostics" aria-controls="panel-diagnostics" aria-selected="true" tabindex="0" data-tab="diagnostics" data-i18n="tab.diagnostics"></button>
        <button role="tab" id="tab-analysis" aria-controls="panel-analysis" aria-selected="false" tabindex="-1" data-tab="analysis" data-i18n="tab.analysis"></button>
        <button role="tab" id="tab-tokens" aria-controls="panel-tokens" aria-selected="false" tabindex="-1" data-tab="tokens" data-i18n="tab.tokens"></button>
        <button role="tab" id="tab-cst" aria-controls="panel-cst" aria-selected="false" tabindex="-1" data-tab="cst" data-i18n="tab.cst"></button>
        <button role="tab" id="tab-ast" aria-controls="panel-ast" aria-selected="false" tabindex="-1" data-tab="ast" data-i18n="tab.ast"></button>
        <button role="tab" id="tab-circuit" aria-controls="panel-circuit" aria-selected="false" tabindex="-1" data-tab="circuit" data-i18n="tab.circuit"></button>
        <button role="tab" id="tab-table" aria-controls="panel-table" aria-selected="false" tabindex="-1" data-tab="table" data-i18n="tab.table"></button>
        <button role="tab" id="tab-delays" aria-controls="panel-delays" aria-selected="false" tabindex="-1" data-tab="delays" data-i18n="tab.delays"></button>
      </div></div>
      <div id="result-content" class="result-content">
        <section role="tabpanel" id="panel-diagnostics" aria-labelledby="tab-diagnostics"></section>
        <section role="tabpanel" id="panel-analysis" aria-labelledby="tab-analysis" hidden></section>
        <section role="tabpanel" id="panel-tokens" aria-labelledby="tab-tokens" hidden></section>
        <section role="tabpanel" id="panel-cst" aria-labelledby="tab-cst" hidden></section>
        <section role="tabpanel" id="panel-ast" aria-labelledby="tab-ast" hidden></section>
        <section role="tabpanel" id="panel-circuit" aria-labelledby="tab-circuit" hidden></section>
        <section role="tabpanel" id="panel-table" aria-labelledby="tab-table" hidden></section>
        <section role="tabpanel" id="panel-delays" aria-labelledby="tab-delays" hidden></section>
      </div>
    </section>
  </main>
  <footer class="app-footer"><span>circuito-lang</span><span data-i18n="app.footer"></span><a href="https://github.com/Luckleal/circuito-lang" target="_blank" rel="noopener noreferrer" data-i18n="app.repository"></a></footer>
</body>
</html>
